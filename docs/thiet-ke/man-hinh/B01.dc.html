nt="2"><button type="button" onClick="{{p.dec}}" aria-label="Bớt một {{p.short}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px 0 12px; border-radius: var(--radius-pill); border: 1.5px solid var(--border); background: var(--bg-100); color: var(--ink); font-family: var(--font-baba); font-size: 12px; font-weight: 600; cursor: pointer;">{{p.short}} <strong>×{{p.count}}</strong><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button></sc-for></div></sc-if><div style="display: flex; align-items: center; gap: 12px;"><div style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted);">{{totalLabel}}</span><span style="font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums;">{{totalMoney}}</span></div><a href="B02.dc.html" class="bb-btn bb-btn--lg" style="text-decoration: none; min-width: 150px; opacity: {{saveOpacity}}; pointer-events: {{saveEvents}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5L11 15.5L16.5 9.5"/></svg> Lưu đơn</a></div></div><nav aria-label="Điều hướng chính" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--bg-100); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));"><a href="A04.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--ink-muted); font-size: 12px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap= <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { counts: { md: 2, tcc: 1 } };
  }
  products() { return [{"id": "md", "line": "xanh", "name": "Mầm Đỏ Hồng Đào", "short": "Đỏ Hồng Đào", "price": 15000, "color": "#B9675A", "left": 2}, {"id": "mv", "line": "xanh", "name": "Mầm Vàng Thơm Ngon", "short": "Vàng Thơm Ngon", "price": 15000, "color": "#F2D27A", "left": 1}, {"id": "mden", "line": "xanh", "name": "Mầm Đen Khỏe Mạnh", "short": "Đen Khỏe Mạnh", "price": 15000, "color": "#2E2E2C", "left": 0}, {"id": "sh", "line": "sang", "name": "Sáng Hồng Đào", "short": "Sáng Hồng Đào", "price": 20000, "color": "#D9558B", "left": 0}, {"id": "stt", "line": "lanh", "name": "Sáng Trí Tuệ", "short": "Sáng Trí Tuệ", "price": 25000, "color": "#F0B74A", "left": 1}, {"id": "tmc", "line": "tre", "name": "Matcha", "short": "Matcha", "price": 30000, "color": "#8DB35E", "left": 1}, {"id": "tcc", "line": "tre", "name": "Cacao", "short": "Cacao", "price": 30000, "color": "#6B4532", "left": 1}]; }
  money(n) { return n.toLocaleString('vi-VN') + ' đ'; }
  tilesFor(line) {
    const c = this.state.counts;
    return this.products().filter(p => p.line === line).map(p => {
      const n = c[p.id] || 0;
      return {
        name: p.name, short: p.short, price: this.money(p.price), color: p.color, count: n, left: p.left,
        pressed: n > 0 ? 'true' : 'false',
        aria: p.name + ', ' + this.money(p.price) + (n ? ', đã chọn ' + n : ''),
        border: n > 0 ? 'var(--brand)' : 'transparent',
        badgeDisplay: n > 0 ? 'block' : 'none',
        inc: () => this.setState({ counts: { ...c, [p.id]: n + 1 } })
      };
    });
  }
  segment(items, key) {
    return items.map((label, i) => {
      const on = this.state[key] === i;
      return { label, pressed: on ? 'true' : 'false',
        border: on ? 'var(--brand)' : 'var(--border)', bg: on ? 'var(--bg-brand)' : 'var(--bg-100)', fg: on ? 'var(--ink-on-brand)' : 'var(--ink)',
        pick: () => this.setState({ [key]: i }) };
    });
  }
  renderVals() {
    const c = this.state.counts;
    let bottles = 0, money = 0; const picked = [];
    for (const p of this.products()) {
      const n = c[p.id] || 0; if (!n) continue;
      bottles += n; money += n * p.price;
      picked.push({ short: p.short, count: n, dec: () => {
        const next = { ...c }; if (n <= 1) delete next[p.id]; else next[p.id] = n - 1; this.setState({ counts: next }); } });
    }
    return {
      xanh: this.tilesFor('xanh'), sang: this.tilesFor('sang'), lanh: this.tilesFor('lanh'), tre: this.tilesFor('tre'),
      picked, hasAny: bottles > 0,
      totalLabel: bottles ? bottles + ' chai trong đơn' : 'Chưa chọn món',
      totalMoney: bottles ? this.money(money) : '0 đ',
      saveOpacity: bottles ? '1' : '0.45', saveEvents: bottles ? 'auto' : 'none'
    };
  }
}
</script>
