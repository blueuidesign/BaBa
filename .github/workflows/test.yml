# Kiểm thử tự động: chạy mỗi khi có pull request hoặc code vào main.
# - "App": kiểm kiểu, chạy unit test các hàm tính toán, build thử.
# - "Database": dựng database trống từ toàn bộ migration rồi chạy tests/db (ghi đơn, trừ kho, ghi cuối ngày, phân quyền…).
# Không dùng secret nào và không chạm vào database thật.
name: Kiểm thử

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm kiểu
        run: npm run typecheck
      - name: Unit test
        run: npm test
      - name: Build thử
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Dựng database từ migration và chạy kiểm thử
        run: bash scripts/test-db.sh
